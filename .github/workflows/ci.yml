name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  lint:
    name: Lint (ruff)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@v10.3.2
        with:
          enable-cache: true
      - name: ruff check
        run: uv run --locked --only-group lint ruff check
      - name: ruff format
        run: uv run --locked --only-group lint ruff format --check

  typecheck:
    name: Type check (ty)
    # Non-blocking for now; see agreed plan. Remove continue-on-error once the codebase is clean.
    continue-on-error: true
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@v10.3.2
        with:
          enable-cache: true
      - name: ty check
        run: uv run --locked --group typing ty check

  test:
    name: Test (${{ matrix.os }}, py${{ matrix.python-version }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
        python-version: ["3.11", "3.12", "3.13"]
    defaults:
      run:
        # Use bash everywhere so the same run scripts work on Windows runners.
        shell: bash
    env:
      UV_PYTHON: ${{ matrix.python-version }}
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@v10.3.2
        with:
          enable-cache: true
      - name: Install test dependencies
        run: uv sync --locked --group test
      # Windows is expected to work. If a dependency fails to install or
      # behaves differently there, investigate the root cause rather than
      # dropping the Windows cell from the matrix.
      - name: Run tests with coverage
        run: uv run pytest --cov=orgdisord --cov-report=term-missing --cov-report=xml
      - name: Coverage summary
        if: always()
        run: |
          if [ -f coverage.xml ]; then
            uv run coverage report --format=markdown >> "$GITHUB_STEP_SUMMARY"
          fi
      - name: Upload coverage
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: coverage-${{ matrix.os }}-py${{ matrix.python-version }}
          path: coverage.xml
          if-no-files-found: ignore

  build:
    name: Build and smoke test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@v10.3.2
        with:
          enable-cache: true
      - name: Build sdist and wheel
        run: uv build
      - name: Check metadata
        run: uvx twine check dist/*
      - name: Smoke test wheel in a clean venv
        run: |
          uv venv "$RUNNER_TEMP/smoke"
          uv pip install --python "$RUNNER_TEMP/smoke/bin/python" dist/*.whl
          "$RUNNER_TEMP/smoke/bin/orgdisord" --help
          "$RUNNER_TEMP/smoke/bin/python" -c "import orgdisord; print(orgdisord.__version__)"
      - name: Upload distributions
        uses: actions/upload-artifact@v7
        with:
          name: dist
          path: dist/
