[build-system]
requires = ["setuptools>=61.2"]
build-backend = "setuptools.build_meta"

[project]
name = "orgdisord"
authors = [{ name = "Kane Shenton", email = "jkshenton@gmail.com" }]
license = { text = "MIT license" }
description = "Python code to handle disordered molecular crystals."
keywords = ["orgdisord"]
dynamic = ["version", "readme"]
classifiers = [
    "Development Status :: 2 - Pre-Alpha",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Natural Language :: English",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.6",
    "Programming Language :: Python :: 3.7",
    "Programming Language :: Python :: 3.8",
]
requires-python = ">=3.12"
dependencies = [
    "typer>=0.16.1",
    "ASE>=3.26",
    "Soprano>=0.10.1",
    "pymatgen>=2025.6.14",
    "tqdm>=4.67.1",
    "pandas>=2.3.1",
    "scipy>=1.15.3",
]

[tool.setuptools.dynamic]
version = { attr = "orgdisord.__version__" }
readme = { file = "README.rst" }

[project.urls]
Homepage = "https://github.com/CCP-NC/orgdisord"

[project.scripts]
orgdisord = "orgdisord.cli:cli"

[project.optional-dependencies]
testing = ["pytest>=3"]
ML = ["dscribe>=2.1.1"]

[tool.bumpversion]
current_version = "0.2.0"
commit = "True"
tag = "True"

[tool.bumpversion.file.setup.py]
search = "version='{current_version}'"
replace = "version='{new_version}'"

[tool.bumpversion.file."orgdisord/__init__".py]
search = "__version__ = '{current_version}'"
replace = "__version__ = '{new_version}'"

[tool.setuptools]
zip-safe = false
include-package-data = true

[tool.setuptools.packages.find]
include = ["orgdisord"] # orgdisord.*
namespaces = false

[tool.distutils.bdist_wheel]
universal = 1

[tool.flake8]
exclude = "docs"

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]
python_functions = ["test_*"]

[dependency-groups]
dev = [
    "pytest>=8.4.1",
    "pytest-cov>=6.2.1",
]
