[build-system]
requires = ["uv_build>=0.11.21,<0.14.0"]
build-backend = "uv_build"

[project]
name = "orgdisord"
version = "0.2.0"
authors = [{ name = "Kane Shenton", email = "jkshenton@gmail.com" }]
license = "MIT"
license-files = ["LICENSE"]
readme = "README.rst"
description = "Python code to handle disordered molecular crystals."
keywords = ["orgdisord"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "Natural Language :: English",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
]
requires-python = ">=3.11"
dependencies = [
    "Click>=8.0",
    "ASE>=3.26",
    "Soprano>=0.8",
    "pymatgen>=2022.3.7",
    "tqdm>=4.63.0",
    "pandas>=1.3",
    "scipy",
    "spglib",
]

[project.urls]
Homepage = "https://github.com/CCP-NC/orgdisord"
Repository = "https://github.com/CCP-NC/orgdisord"
Issues = "https://github.com/CCP-NC/orgdisord/issues"
Documentation = "https://ccp-nc.github.io/orgdisord/"

[project.scripts]
orgdisord = "orgdisord.cli:cli"

[project.optional-dependencies]
ML = ["dscribe>=1.2"]

[dependency-groups]
test = ["pytest>=8", "pytest-cov"]
docs = ["sphinx>=7", "sphinx-book-theme", "sphinx-click", "sphinx-copybutton"]
lint = ["ruff", "pre-commit"]
typing = ["ty"]
dev = [
    { include-group = "test" },
    { include-group = "lint" },
    { include-group = "typing" },
    { include-group = "docs" },
]

[tool.uv]
default-groups = ["dev"]

[tool.uv.build-backend]
module-name = "orgdisord"
module-root = "src"

[tool.ruff]
line-length = 88
target-version = "py311"
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
# E501: left to the formatter. B905: zip(strict=) is not added mechanically.
ignore = ["E501", "B905"]

[tool.ty.environment]
root = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = ["--strict-markers"]
filterwarnings = [
    # Emitted inside ASE 3.29 with NumPy >= 2.5; remove once ASE is fixed upstream.
    "ignore:Setting the shape on a NumPy array:DeprecationWarning",
]

[tool.coverage.run]
source = ["orgdisord"]
branch = true

[tool.coverage.report]
show_missing = true
